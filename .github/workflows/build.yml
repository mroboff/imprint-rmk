name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  product-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v25
      - name: Check host crates and board parity
        run: nix develop --command just parity-check
      - name: Build and validate Glove80 firmware
        run: nix develop --command just dist
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: glove80-rmk
          path: dist/
      - name: Build and validate Go60 firmware
        run: nix develop --command just go60-firmware
      - name: Upload Go60 bundle
        uses: actions/upload-artifact@v4
        with:
          name: go60-rmk
          path: dist/go60/
      - name: Build and validate Imprint firmware
        run: nix develop --command just imprint-firmware
      - name: Upload Imprint bundle
        uses: actions/upload-artifact@v4
        with:
          name: imprint-rmk
          path: dist/imprint/

  release-master:
    name: Publish master firmware
    # A push to master, or a run started by hand on master: a fork whose
    # pushes do not start workflows still gets its release.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: product-stack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two commits landing together would otherwise race for the same calendar
    # version, and the loser's `gh release create` would fail on the taken tag.
    concurrency:
      group: release-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: glove80-rmk
          path: dist
      - name: Download Go60 bundle
        uses: actions/download-artifact@v4
        with:
          name: go60-rmk
          path: dist-go60
      - name: Download Imprint bundle
        uses: actions/download-artifact@v4
        with:
          name: imprint-rmk
          path: dist-imprint
      # The Go60 bundle's manifest.json and SHA256SUMS would collide with the
      # Glove80 bundle's as flat release assets, so it ships as one archive.
      - name: Archive Go60 bundle
        run: (cd dist-go60 && zip -r ../go60-rmk.zip .)
      - name: Archive Imprint bundle
        run: (cd dist-imprint && zip -r ../imprint-rmk.zip .)
      - name: Create or update commit prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running a published commit must land back on its own release
          # instead of minting a second version for identical firmware.
          tag="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | head -1)"
          if [ -z "${tag}" ]; then
            day="$(git show -s --format=%cd --date=format-local:%Y.%m.%d "${GITHUB_SHA}")"
            build=1
            while git rev-parse -q --verify "refs/tags/v${day}.${build}" >/dev/null; do
              build=$((build + 1))
            done
            tag="v${day}.${build}"
          fi
          title="RMK firmware ${tag#v} (default configurations)"

          previous="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "${previous}" ]; then
            changes="$(git log --reverse --pretty='- %s' "${previous}..${GITHUB_SHA}")"
          else
            changes="$(git log --reverse --pretty='- %s' -20 "${GITHUB_SHA}")"
          fi
          {
            echo "## Changes"
            echo
            echo "${changes:-- No commits since the previous release.}"
            echo
            echo "The Go60 firmware is attached as go60-rmk.zip, the Cyboard Imprint firmware as imprint-rmk.zip."
          } > release-notes.md

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* go60-rmk.zip imprint-rmk.zip \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
            gh release edit "${tag}" \
              --prerelease \
              --title "${title}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" dist/* go60-rmk.zip imprint-rmk.zip \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file release-notes.md \
              --repo "${GITHUB_REPOSITORY}"
          fi
